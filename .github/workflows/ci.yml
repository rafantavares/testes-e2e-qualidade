name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  testes:
    name: Testes (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagem oficial com navegadores e fontes fixos: a renderização fica idêntica
    # entre execuções, o que a regressão visual exige. A versão acompanha a do
    # @playwright/test no package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      # Um shard falhar não cancela os outros: o relatório final mostra todas as falhas.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Todos os projetos (Chromium, Firefox, WebKit, mobile, API, a11y e visual)
      # são divididos entre os 4 shards, teste a teste (fullyParallel).
      - name: Rodar a suíte
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Publicar relatório parcial (blob)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      # Snapshots novos (ou alterados com --update-snapshots) ficam disponíveis
      # para revisão e commit, já que a baseline de Linux só pode nascer aqui.
      - name: Publicar snapshots de Linux
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-linux-${{ matrix.shard }}
          path: tests/visual/__snapshots__/*-linux.png
          if-no-files-found: ignore
          retention-days: 7

  relatorio:
    name: Testes Playwright
    # Junta os relatórios dos shards em um HTML único. Também serve de check
    # agregado: só passa se todos os shards passarem.
    if: ${{ !cancelled() }}
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: todos-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Gerar relatório HTML
        run: npx playwright merge-reports --reporter html ./todos-blob-reports
      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14
      - name: Falhar se algum shard falhou
        if: ${{ needs.testes.result != 'success' }}
        run: |
          echo "::error::Algum shard falhou (resultado: ${{ needs.testes.result }}). Veja o relatório."
          exit 1

  publicar:
    name: Publicar relatório no GitHub Pages
    # Publica a cada execução na main, inclusive quando há falhas (é quando o
    # relatório mais ajuda). Não roda em PRs: o environment github-pages só
    # aceita deploys da branch padrão.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: relatorio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relatorio-playwright
          path: relatorio
      - name: Verificar se o GitHub Pages está ativado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > /tmp/tipo 2>/dev/null; then
            echo "ativo=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages ativo (fonte: $(cat /tmp/tipo))."
          else
            echo "ativo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages desativado::Ative em Settings > Pages > Source: GitHub Actions para publicar o relatório. Até lá ele fica só como artefato."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: relatorio
      - name: Publicar
        id: deploy
        if: ${{ steps.pages.outputs.ativo == 'true' }}
        uses: actions/deploy-pages@v4
